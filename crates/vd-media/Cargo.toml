[package]
name = "vd-media"
description = "Video encoding, capture pipelines and media-file playback behind an FFmpeg-version-independent API"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = []
# In-process capture + encode through the libav* C API (`inproc.rs`).  Needs FFmpeg headers and
# libraries at build time (FFMPEG_DIR, see packaging/windows/fetch-ffmpeg.ps1) and the DLLs at run
# time.  Pin `ffmpeg-sys-next`'s major version to FFmpeg's (9.x <-> FFmpeg 9).  The CLI backend
# is always available as a fallback.
ffmpeg-lib = ["dep:ffmpeg-sys-next"]

[dependencies]
vd-protocol = { path = "../vd-protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ffmpeg-sys-next = { version = "9.0.1", optional = true, default-features = false, features = ["avcodec", "avfilter"] }
