[package]
name = "vd-platform"
description = "Operating-system abstraction (input injection, audio devices, Wi-Fi tuning, displays, IPC) for Windows and Linux"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
vd-protocol = { path = "../vd-protocol" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12.2"
libc = "0.2.155"

[target.'cfg(windows)'.dependencies]
# COM-based APIs: audio (WASAPI loopback, endpoint volume, DirectShow, IKsControl) and DXGI adapter names.
windows = { version = "0.58.0", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_DirectShow",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Registry",
] }
# Needed by the `#[implement]` macro (COM callbacks such as process-loopback activation).
windows-core = "0.58.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WiFi",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }
