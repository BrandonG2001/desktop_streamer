[package]
name = "desktop_streamer"
version = "0.1.0"
edition = "2024"
description = "Cross-platform (Windows / Linux, x86-64 / ARM64) Rust port of the Virtual Desktop Streamer"
license = "LicenseRef-Private"
publish = false

[[bin]]
name = "desktop_streamer"
path = "src/main.rs"

[features]
default = []
# Link libav* directly (lower latency). Requires FFmpeg development headers/libraries.
# Without it the streamer drives the `ffmpeg` command-line tool, which works with any FFmpeg version.
ffmpeg-lib = ["vd-media/ffmpeg-lib"]

[dependencies]
vd-protocol = { path = "crates/vd-protocol" }
vd-net = { path = "crates/vd-net" }
vd-media = { path = "crates/vd-media" }
vd-platform = { path = "crates/vd-platform" }
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
bytemuck.workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
aes = "0.8.4"
anyhow = "1.0.86"
bytemuck = { version = "1.16.1", features = ["derive", "min_const_generics"] }
cbc = "0.1.2"
clap = { version = "4.5.9", features = ["derive"] }
dirs = "5.0.1"
lz4_flex = { version = "0.11.3", default-features = false, features = ["std", "safe-decode", "safe-encode"] }
rand = "0.8.5"
reqwest = { version = "0.12.5", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
serde_repr = "0.1.19"
socket2 = { version = "0.5.7", features = ["all"] }
thiserror = "1.0.63"
tokio = { version = "1.38.1", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
xxhash-rust = { version = "0.8.11", features = ["xxh3"] }

[profile.release]
lto = "thin"
codegen-units = 1
